name: Verify laboratory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: uv sync --locked --python 3.12 --extra inspect
      - run: uv run pytest --cov=benchlab --cov-report=term-missing --cov-report=xml
      - run: uv run ruff check src tests examples
      - run: uv run mypy src/benchlab
      - run: uv build
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --locked --python 3.12
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chrome
      - run: uv run uvicorn benchlab.api:app_factory --factory --host 127.0.0.1 --port 8000 > /tmp/bench-agents-api.log 2>&1 &
        env:
          BENCH_AGENTS_DATA_DIR: .bench-agents/browser-tests
          BENCH_AGENTS_ALLOW_HOST_PROCESS: "1"
      - run: npm run dev > /tmp/benchlab-web.log 2>&1 &
      - run: uv run python scripts/ci_wait.py
      - run: npm run test:e2e
