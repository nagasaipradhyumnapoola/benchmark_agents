[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bench-agents"
version = "0.1.0"
description = "Local-first, evidence-driven model and agent experimentation laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "typer>=0.16,<1", "rich>=14,<16", "jsonschema>=4.23,<5", "psutil>=7,<8"]

[project.optional-dependencies]
analysis = ["duckdb>=1.3,<2", "pyarrow>=19,<24"]
inspect = ["inspect-ai>=0.3,<1"]
mlflow = ["mlflow>=3.8,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pip-audit>=2.9,<3", "types-jsonschema>=4.23"]

[project.scripts]
bench-agents = "benchlab.cli:app"
benchlab = "benchlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/benchlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

