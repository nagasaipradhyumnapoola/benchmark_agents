services:
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BENCH_AGENTS_DATA_DIR: /data
    volumes:
      - benchlab-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
volumes:
  benchlab-data:
